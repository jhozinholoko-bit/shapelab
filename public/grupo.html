<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Grupo · ShapeLab</title>
<meta property="og:title" content="Vem treinar comigo · ShapeLab">
<meta property="og:description" content="Entre no grupo e poste seus treinos.">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#0A0A0A;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);--glass:rgba(255,255,255,.045);--glass-2:rgba(255,255,255,.08);
  --fg:#EEF6FA;--soft:#C3D2DA;--muted:#8392A0;--dim:#4C5763;
  --cer:#007BA7;--cer-hi:#33BFF0;--rose:#FF2D95;--rose-hi:#FF6CB6;--bad:#FF5571;
  --f-disp:"Unbounded","Outfit",system-ui,sans-serif;--f-ui:"Outfit",system-ui,-apple-system,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--fg);font-family:var(--f-ui);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:radial-gradient(90% 50% at 10% -10%,rgba(0,123,167,.22),transparent 60%),radial-gradient(70% 40% at 100% 0%,rgba(255,45,149,.12),transparent 60%),var(--void) fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font-size:16px!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.top{display:flex;align-items:center;gap:10px;min-height:52px;margin-bottom:8px}
.ic-b{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line-2);background:var(--glass);display:grid;place-items:center;font-size:18px;text-decoration:none;color:var(--fg)}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-family:var(--f-disp);font-weight:600;font-size:20px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kicker{margin:0;font:500 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kicker b{color:var(--cer-hi);font-weight:500}
.meta{margin:0;color:var(--muted);font-size:14px}
.pnl{position:relative;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);padding:16px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--glass);font-weight:600;font-size:15px;text-decoration:none;color:var(--fg)}
.b.pri{background:linear-gradient(180deg,#0A8FC2,var(--cer));border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(0,123,167,.35)}
.b.rose{background:linear-gradient(135deg,var(--cer),var(--rose));border-color:transparent;color:#fff}
.b.w{width:100%}.b:disabled{opacity:.5}
.lnk{background:none;border:0;padding:6px;color:var(--cer-hi);font-weight:600;font-size:14px;text-decoration:none}
.lnk.mut{color:var(--muted)}.lnk.bad{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line-2);background:rgba(0,0,0,.35);outline:none}
.inp:focus{border-color:var(--cer-hi);box-shadow:0 0 0 3px rgba(51,191,240,.18)}
textarea.inp{resize:none;min-height:80px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.flask{flex:none;filter:drop-shadow(0 0 18px rgba(51,191,240,.4))}
/* convite */
.join{margin-top:6vh;gap:16px}
.join h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(24px,7vw,32px);letter-spacing:-.02em;line-height:1.15}
.join .pnl{width:100%;text-align:left;display:flex;flex-direction:column;gap:12px}
/* abas */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);margin:4px 0 14px}
.tabs button{border:0;border-radius:999px;background:transparent;padding:10px;font-weight:600;color:var(--soft)}
.tabs button.on{background:var(--glass-2);color:#fff;box-shadow:inset 0 0 0 1px var(--line-2)}
/* posts */
.feed{display:flex;flex-direction:column;gap:14px}
.post{padding:0;overflow:hidden}
.p-h{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--cer),var(--rose))}
.p-who{flex:1;min-width:0}.p-who b{display:block;font-weight:600}.p-who small{color:var(--muted);font-size:12.5px}
.p-x{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 8px;border-radius:10px}
.p-img{display:block;width:100%;max-height:520px;object-fit:cover;background:#05070a}
.p-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.p-t{margin:0;font-size:17px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid rgba(51,191,240,.35);color:var(--cer-hi);background:rgba(0,123,167,.12)}
.chip.r{border-color:rgba(255,45,149,.35);color:var(--rose-hi);background:rgba(255,45,149,.1)}
.p-note{margin:0;color:var(--soft);white-space:pre-wrap;word-break:break-word}
.reacts{display:flex;gap:8px;margin-top:2px}
.rx{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:15px}
.rx span{font:500 12px var(--f-mono);color:var(--soft)}
.rx.on{border-color:var(--rose);background:rgba(255,45,149,.14)}
.empty{padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* ranking */
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--soft)}
.seg button.on{background:rgba(0,123,167,.22);border-color:var(--cer);color:#fff}
.rank{display:flex;flex-direction:column;gap:8px}
.rk{display:grid;grid-template-columns:34px 40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px}
.rk .pos{font:600 14px var(--f-mono);color:var(--muted);text-align:center}
.rk.p1 .pos{color:#FFD36B}.rk.p2 .pos{color:#C9D6DF}.rk.p3 .pos{color:#E3A06B}
.rk .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cer-hi),var(--rose))}
.rk .n{font:600 20px var(--f-disp);text-align:right}.rk .n small{display:block;font:500 10px var(--f-mono);letter-spacing:.12em;color:var(--muted)}
.tag{font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:6px}
/* botão flutuante */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:20;padding:16px 26px;border-radius:999px;border:0;color:#fff;font-weight:700;font-size:16px;
  background:linear-gradient(135deg,var(--cer),var(--rose));box-shadow:0 12px 30px rgba(255,45,149,.3),0 8px 20px rgba(0,0,0,.5);white-space:nowrap}
/* folha */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(3,5,8,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sh-box{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:#10131a;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:14px}
.sh-top{display:flex;align-items:center;justify-content:space-between}
.sh-top h3{margin:0;font-family:var(--f-disp);font-weight:600;font-size:18px}
.ph-pick{position:relative;border-radius:20px;border:1.5px dashed var(--line-2);background:rgba(0,0,0,.3);min-height:150px;display:grid;place-items:center;overflow:hidden;color:var(--soft);text-align:center;padding:0}
.ph-pick img{width:100%;max-height:340px;object-fit:cover;display:block}
.ph-pick .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-align:left;font-weight:600}
.mi small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.mi.bad{color:var(--bad)}
.mem{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}.mem .nm{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);z-index:60;max-width:calc(100% - 32px);padding:12px 18px;border-radius:16px;background:#1b2029;border:1px solid var(--line-2);font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.load{height:60vh;display:grid;place-items:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--cer-hi);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="slLiquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33BFF0"/><stop offset="1" stop-color="#FF2D95"/></linearGradient>
  <linearGradient id="slGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9F5FF"/><stop offset=".5" stop-color="#33BFF0"/><stop offset="1" stop-color="#FF6CB6"/></linearGradient>
  <clipPath id="slClip"><path d="M43 12 V39 L19 82 Q16.5 88 23.5 88 H76.5 Q83.5 88 81 82 L57 39 V12 Z"/></clipPath>
</defs></svg>
<main class="wrap" id="app"><div class="load"><div class="spin" aria-label="Carregando"></div></div></main>
<button class="fab" id="fab" data-a="compose" hidden>＋ Postar treino</button>
<div class="sheet" id="sheet" hidden><div class="sh-box" id="shBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="phFile" accept="image/*" hidden>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const invite = (location.pathname.match(/\/g\/([a-z0-9]+)/) || [])[1] || new URLSearchParams(location.search).get("g") || "";
const store = {
  get(k) { try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return MEM[k] ?? null; } },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, v); } catch {} },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch {} }
};
const MEM = {};
const acct = () => store.get("sl_token");
const gkey = "slg_" + invite;
let F = null, tab = "feed", per = "week", photo = null, busy = false;

async function api(fn, args = {}) {
  const body = {p_invite: invite, ...args};
  if (acct()) body.p_token = acct();
  const gt = store.get(gkey); if (gt) body.p_gtoken = gt;
  const r = await fetch("/api/" + fn, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.message || "erro"); e.code = j.message; throw e; }
  return j;
}
const ERR = {group_not_found: "Esse convite não existe mais.", invalid_name: "Digite um nome com pelo menos 2 letras.", group_full: "Esse grupo já está cheio.",
  photo_too_large: "Foto muito grande. Tente outra.", empty_post: "Coloque pelo menos o treino, uma legenda ou uma foto.", too_many_posts: "Limite de posts de hoje atingido.",
  forbidden: "Você não tem permissão para isso.", owner_cannot_leave: "O dono não pode sair. Apague o grupo, se quiser.", not_authenticated: "Sua sessão expirou. Entre de novo no app."};
const errMsg = e => ERR[e && e.code] || "Não deu certo. Confira a internet e tente de novo.";
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }

function flask(size) {
  return `<svg class="flask" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><g clip-path="url(#slClip)">
    <path d="M0 57 Q12 51 25 57 T50 57 T75 57 T100 57 V100 H0 Z" fill="url(#slLiquid)"/>
    <path d="M0 57 Q12 51 25 57 T50 57 T75 57 T100 57" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="1.2"/></g>
    <path d="M43 12 V39 L19 82 Q16.5 88 23.5 88 H76.5 Q83.5 88 81 82 L57 39 V12" fill="none" stroke="url(#slGlass)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M37 11 H63" stroke="url(#slGlass)" stroke-width="4" stroke-linecap="round"/></svg>`;
}
const initials = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const pad = n => String(n).padStart(2, "0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dayKey(d); }
function monthStart() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`; }
function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return "agora"; if (s < 3600) return `há ${Math.floor(s / 60)} min`; if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  const d = new Date(ms); return d.toLocaleDateString("pt-BR", {day: "2-digit", month: "short"}).replace(".", "");
}
const inviteUrl = () => `${location.origin}/g/${invite}`;

/* ---------- telas ---------- */
async function boot() {
  if (!invite) return renderMsg("Link incompleto", "Peça o link do grupo de novo para quem te convidou.");
  if (acct() || store.get(gkey)) {
    try { await loadFeed(); return; }
    catch (e) { if (e.code === "group_not_found") return renderMsg("Grupo não encontrado", "Esse convite não existe mais."); if (e.code === "not_authenticated") store.del("sl_token"); if (e.code !== "not_member" && e.code !== "not_authenticated") return renderMsg("Sem conexão", "Não consegui carregar o grupo. Tente de novo.", true); }
  }
  try { const info = await api("g_info"); renderJoin(info); }
  catch (e) { renderMsg(e.code === "group_not_found" ? "Grupo não encontrado" : "Sem conexão", e.code === "group_not_found" ? "Esse convite não existe mais." : "Não consegui carregar o grupo. Tente de novo.", e.code !== "group_not_found"); }
}
function renderMsg(t, m, retry) {
  $("#fab").hidden = true;
  $("#app").innerHTML = `<div class="center join">${flask(84)}<h2>${esc(t)}</h2><p class="meta">${esc(m)}</p>${retry ? `<button class="b pri" data-a="reload">Tentar de novo</button>` : ""}<a class="lnk" href="/">Abrir o ShapeLab</a></div>`;
}
function renderJoin(info) {
  $("#fab").hidden = true;
  const name = store.get("sl_name");
  $("#app").innerHTML = `<div class="center join">${flask(84)}
    <p class="kicker">Convite para <b>treinar junto</b></p>
    <h2>${esc(info.name)}</h2>
    <p class="meta">${info.members} ${info.members === 1 ? "pessoa" : "pessoas"}${info.owner ? ` · criado por ${esc(info.owner)}` : ""}</p>
    <div class="pnl">
      ${acct() ? `<p class="meta">Você vai entrar com a sua conta do ShapeLab${name ? ` (<b style="color:var(--fg)">${esc(name)}</b>)` : ""}.</p><button class="b pri w" data-a="joinAcct">Entrar no grupo</button>`
      : `<div class="field"><label for="jn">Seu nome no grupo</label><input class="inp" id="jn" maxlength="40" autocomplete="given-name" placeholder="Como o grupo vai te ver"></div>
         <button class="b pri w" data-a="joinGuest">Entrar no grupo</button>
         <p class="meta" style="font-size:13px">Não precisa de cadastro. Se quiser registrar seus treinos com fichas e cronômetro, crie uma conta no ShapeLab depois.</p>`}
    </div>
    ${acct() ? "" : `<a class="lnk" href="/?g=${encodeURIComponent(invite)}">Já tenho conta no ShapeLab</a>`}</div>`;
}
async function loadFeed(more) {
  const r = await api("g_feed", {p_week: weekStart(), p_month: monthStart(), p_before: more && F && F.posts.length ? F.posts[F.posts.length - 1].created_at : undefined});
  if (more && F) { F.posts = F.posts.concat(r.posts); F.more = r.more; } else F = r;
  document.title = `${F.group.name} · ShapeLab`;
  render();
  if (!more) { try { const d = sessionStorage.getItem("sl_gdraft"); if (d) { sessionStorage.removeItem("sl_gdraft"); openCompose(JSON.parse(d)); } } catch {} }
}
function render() {
  $("#fab").hidden = false;
  const top = `<header class="top">${acct() ? `<a class="ic-b" href="/" aria-label="Voltar para o app">←</a>` : `<span class="ic-b" aria-hidden="true" style="border:0;background:none">${flask(34)}</span>`}
    <div class="tt"><p class="kicker">Grupo · ${F.members.length} ${F.members.length === 1 ? "pessoa" : "pessoas"}</p><h1>${esc(F.group.name)}</h1></div>
    <button class="ic-b" data-a="invite" aria-label="Convidar">＋</button><button class="ic-b" data-a="menu" aria-label="Opções do grupo">⋯</button></header>
    <div class="tabs" role="tablist"><button role="tab" class="${tab === "feed" ? "on" : ""}" aria-selected="${tab === "feed"}" data-a="tab" data-t="feed">Feed</button><button role="tab" class="${tab === "rank" ? "on" : ""}" aria-selected="${tab === "rank"}" data-a="tab" data-t="rank">Ranking</button></div>`;
  $("#app").innerHTML = top + (tab === "feed" ? feedHtml() : rankHtml());
}
function feedHtml() {
  if (!F.posts.length) return `<div class="pnl empty">${flask(60)}<p style="margin:0;font-weight:600">Ninguém postou ainda</p><p class="meta">Poste o treino de hoje e chame a galera com o botão ＋ lá em cima.</p></div>`;
  return `<div class="feed">${F.posts.map(p => {
    const own = p.member_id === F.me.id, can = own || F.me.role === "owner";
    const chips = [p.minutes ? `<span class="chip">⏱ ${p.minutes} min</span>` : "", p.sets ? `<span class="chip r">${p.sets} séries</span>` : ""].join("");
    return `<article class="pnl post"><div class="p-h"><span class="av" aria-hidden="true">${esc(initials(p.name))}</span><div class="p-who"><b>${esc(p.name)}${own ? `<span class="tag">você</span>` : ""}</b><small>${ago(p.created_at)}</small></div>
      ${can ? `<button class="p-x" data-a="postMenu" data-id="${p.id}" aria-label="Opções do post">⋯</button>` : ""}</div>
      ${p.photo ? `<img class="p-img" src="${esc(p.photo)}" alt="Foto do treino de ${esc(p.name)}" loading="lazy">` : ""}
      <div class="p-body">${p.title ? `<p class="p-t">${esc(p.title)}</p>` : ""}${chips ? `<div class="chips">${chips}</div>` : ""}${p.note ? `<p class="p-note">${esc(p.note)}</p>` : ""}
        <div class="reacts">${Object.entries(p.reacts).map(([e, n]) => `<button class="rx ${p.mine.includes(e) ? "on" : ""}" data-a="react" data-id="${p.id}" data-e="${e}" aria-pressed="${p.mine.includes(e)}" aria-label="Reagir com ${e}">${e}${n ? `<span>${n}</span>` : ""}</button>`).join("")}</div></div></article>`;
  }).join("")}${F.more ? `<button class="b w" data-a="more">Carregar mais</button>` : ""}</div>`;
}
function rankHtml() {
  const key = per, list = F.members.slice().sort((a, b) => b[key] - a[key] || a.name.localeCompare(b.name)), max = Math.max(1, ...list.map(m => m[key]));
  return `<div class="seg"><button class="${per === "week" ? "on" : ""}" data-a="per" data-p="week">Esta semana</button><button class="${per === "month" ? "on" : ""}" data-a="per" data-p="month">Este mês</button></div>
    <p class="meta" style="margin-bottom:10px">Conta 1 ponto por dia com treino postado.</p>
    <div class="rank">${list.map((m, i) => `<div class="pnl rk p${i + 1}"><span class="pos">${m[key] ? i + 1 + "º" : "–"}</span><span class="av" aria-hidden="true">${esc(initials(m.name))}</span>
      <div class="nm"><b>${esc(m.name)}${m.id === F.me.id ? `<span class="tag">você</span>` : ""}</b><div class="bar"><i style="width:${m[key] / max * 100}%"></i></div></div>
      <span class="n">${m[key]}<small>${m[key] === 1 ? "DIA" : "DIAS"}</small></span></div>`).join("")}</div>`;
}

/* ---------- folhas ---------- */
function openSheet(html) { $("#shBox").innerHTML = html; $("#sheet").hidden = false; document.body.style.overflow = "hidden"; }
function closeSheet() { $("#sheet").hidden = true; document.body.style.overflow = ""; }
let draft = {};
function openCompose(pre) {
  draft = Object.assign({title: "", minutes: "", sets: "", note: ""}, pre || {}); photo = null;
  openSheet(`<div class="sh-top"><h3>Postar treino</h3><button class="ic-b" data-a="close" aria-label="Fechar">✕</button></div>
    <button class="ph-pick" id="phPick" data-a="pickPhoto"><span>📷<br><b>Adicionar foto</b><br><small class="meta">opcional</small></span></button>
    <div class="field"><label for="ct">Treino</label><input class="inp" id="ct" maxlength="60" placeholder="Ex.: Peito e tríceps, corrida, futebol" value="${esc(draft.title)}"></div>
    <div class="grid2"><div class="field"><label for="cm">Duração (min)</label><input class="inp" id="cm" inputmode="numeric" maxlength="3" placeholder="60" value="${esc(draft.minutes)}"></div>
      <div class="field"><label for="cs">Séries</label><input class="inp" id="cs" inputmode="numeric" maxlength="3" placeholder="opcional" value="${esc(draft.sets)}"></div></div>
    <div class="field"><label for="cn">Legenda</label><textarea class="inp" id="cn" maxlength="280" placeholder="Como foi?">${esc(draft.note)}</textarea></div>
    <button class="b rose w" id="cgo" data-a="post">Postar no grupo</button>`);
}
function paintPhoto() {
  const el = $("#phPick"); if (!el) return;
  el.innerHTML = photo ? `<img src="${photo}" alt="Prévia da foto"><span class="x" data-a="rmPhoto" role="button" aria-label="Remover foto">✕</span>` : `<span>📷<br><b>Adicionar foto</b><br><small class="meta">opcional</small></span>`;
}
function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let q = .8, d = cv.toDataURL("image/jpeg", q);
      while (d.length > 1.1e6 && q > .4) { q -= .1; d = cv.toDataURL("image/jpeg", q); }
      res(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    im.src = url;
  });
}
function openMenu() {
  const owner = F.me.role === "owner";
  openSheet(`<div class="sh-top"><h3>${esc(F.group.name)}</h3><button class="ic-b" data-a="close" aria-label="Fechar">✕</button></div>
    <div class="menu"><button class="mi" data-a="invite">＋ <span>Convidar pessoas<small>Manda o link: só entra quem tiver ele</small></span></button>
      <button class="mi" data-a="members">👥 <span>Membros<small>${F.members.length} ${F.members.length === 1 ? "pessoa" : "pessoas"}</small></span></button>
      ${owner ? `<button class="mi" data-a="rename">✎ <span>Renomear grupo</span></button><button class="mi bad" data-a="delGroup">🗑 <span>Apagar grupo<small>Apaga posts e fotos de todo mundo</small></span></button>`
        : `<button class="mi bad" data-a="leave">↩ <span>Sair do grupo</span></button>`}
      ${!acct() ? `<a class="mi" href="/" style="text-decoration:none;color:var(--fg)">${flask(22)} <span>Conhecer o ShapeLab<small>Crie uma conta para montar fichas e registrar treinos</small></span></a>` : ""}</div>`);
}
function openMembers() {
  const owner = F.me.role === "owner";
  openSheet(`<div class="sh-top"><h3>Membros</h3><button class="ic-b" data-a="menu" aria-label="Voltar">←</button></div>
    <div>${F.members.map(m => `<div class="mem"><span class="av" aria-hidden="true">${esc(initials(m.name))}</span><div class="nm"><b>${esc(m.name)}</b><br><small class="meta">${m.role === "owner" ? "Dono do grupo" : m.account ? "Conta ShapeLab" : "Convidado"}</small></div>
      ${owner && m.id !== F.me.id ? `<button class="lnk bad" data-a="kick" data-id="${m.id}">Remover</button>` : ""}</div>`).join("")}</div>`);
}
async function share() {
  const url = inviteUrl(), text = `Vem treinar comigo no grupo "${F ? F.group.name : ""}" 💪`;
  if (navigator.share) { try { await navigator.share({title: "Vem treinar comigo", text, url}); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast("Link do convite copiado"); }
  catch { openSheet(`<div class="sh-top"><h3>Link do convite</h3><button class="ic-b" data-a="close" aria-label="Fechar">✕</button></div><input class="inp" readonly value="${esc(url)}" onfocus="this.select()"><p class="meta">Copie e mande para quem você quer no grupo.</p>`); }
}
let arm = "";
const ACT = {
  reload: () => location.reload(),
  close: () => closeSheet(),
  tab: b => { tab = b.dataset.t; render(); window.scrollTo(0, 0); },
  per: b => { per = b.dataset.p; render(); },
  more: async () => { try { await loadFeed(true); } catch (e) { toast(errMsg(e)); } },
  joinGuest: async b => {
    const n = ($("#jn").value || "").trim(); if (n.length < 2) { toast(ERR.invalid_name); $("#jn").focus(); return; }
    b.disabled = true;
    try { const r = await api("g_join", {p_name: n}); store.set(gkey, r.gtoken); store.set("slg_name", n); await loadFeed(); toast("Bem-vindo ao grupo!"); }
    catch (e) { b.disabled = false; toast(errMsg(e)); }
  },
  joinAcct: async b => { b.disabled = true; try { await api("g_join"); await loadFeed(); toast("Bem-vindo ao grupo!"); } catch (e) { b.disabled = false; toast(errMsg(e)); } },
  compose: () => openCompose(),
  pickPhoto: (b, ev) => { if (ev.target.closest("[data-a='rmPhoto']")) { photo = null; paintPhoto(); return; } $("#phFile").click(); },
  post: async b => {
    if (busy) return;
    const title = $("#ct").value.trim(), minutes = $("#cm").value.trim(), sets = $("#cs").value.trim(), note = $("#cn").value.trim();
    if (!title && !note && !photo) { toast(ERR.empty_post); return; }
    busy = true; b.disabled = true; b.textContent = "Postando…";
    try { await api("g_post", {p_title: title, p_minutes: minutes, p_sets: sets, p_note: note, p_photo: photo || undefined, p_day: dayKey(new Date())}); closeSheet(); tab = "feed"; await loadFeed(); toast("Treino postado 🔥"); window.scrollTo(0, 0); }
    catch (e) { toast(errMsg(e)); b.disabled = false; b.textContent = "Postar no grupo"; }
    finally { busy = false; }
  },
  react: async b => {
    const p = F.posts.find(x => x.id === b.dataset.id), e = b.dataset.e; if (!p) return;
    const on = !p.mine.includes(e); p.mine = on ? p.mine.concat(e) : p.mine.filter(x => x !== e); p.reacts[e] += on ? 1 : -1; render();
    try { await api("g_react", {p_post: p.id, p_emoji: e}); } catch (err) { p.mine = on ? p.mine.filter(x => x !== e) : p.mine.concat(e); p.reacts[e] += on ? -1 : 1; render(); toast(errMsg(err)); }
  },
  postMenu: b => openSheet(`<div class="sh-top"><h3>Post</h3><button class="ic-b" data-a="close" aria-label="Fechar">✕</button></div><div class="menu"><button class="mi bad" data-a="delPost" data-id="${b.dataset.id}">🗑 <span>Apagar post</span></button></div>`),
  delPost: async b => { try { await api("g_del_post", {p_post: b.dataset.id}); closeSheet(); await loadFeed(); toast("Post apagado"); } catch (e) { toast(errMsg(e)); } },
  invite: () => share(),
  menu: () => openMenu(),
  members: () => openMembers(),
  kick: async b => { if (arm !== "k" + b.dataset.id) { arm = "k" + b.dataset.id; b.textContent = "Confirmar"; return; } try { await api("g_kick", {p_member: b.dataset.id}); await loadFeed(); openMembers(); toast("Membro removido"); } catch (e) { toast(errMsg(e)); } },
  rename: () => openSheet(`<div class="sh-top"><h3>Renomear grupo</h3><button class="ic-b" data-a="menu" aria-label="Voltar">←</button></div><input class="inp" id="rn" maxlength="40" value="${esc(F.group.name)}"><button class="b pri w" data-a="renameGo">Salvar</button>`),
  renameGo: async () => { const n = $("#rn").value.trim(); try { await api("g_rename", {p_name: n}); closeSheet(); await loadFeed(); toast("Nome atualizado"); } catch (e) { toast(errMsg(e)); } },
  leave: async b => { if (arm !== "leave") { arm = "leave"; b.querySelector("span").firstChild.textContent = "Toque de novo para sair"; return; } try { await api("g_leave"); store.del(gkey); closeSheet(); location.href = acct() ? "/" : location.pathname; } catch (e) { toast(errMsg(e)); } },
  delGroup: async b => { if (arm !== "del") { arm = "del"; b.querySelector("span").firstChild.textContent = "Toque de novo para apagar tudo"; return; } try { await api("g_delete"); closeSheet(); location.href = "/"; } catch (e) { toast(errMsg(e)); } }
};
document.addEventListener("click", ev => {
  if (ev.target === $("#sheet")) return closeSheet();
  const b = ev.target.closest("[data-a]"); if (!b || b.tagName === "A") return;
  const f = ACT[b.dataset.a]; if (f) { if (!/^(kick|leave|delGroup)$/.test(b.dataset.a)) arm = ""; f(b, ev); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#sheet").hidden) closeSheet(); if (ev.key === "Enter" && ev.target.id === "jn") ACT.joinGuest($("[data-a='joinGuest']")); });
$("#phFile").addEventListener("change", async ev => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try { photo = await compress(f); paintPhoto(); } catch { toast("Não consegui abrir essa foto."); }
});
window.addEventListener("pageshow", ev => { if (ev.persisted && F) loadFeed().catch(() => {}); });
boot();
})();
</script>
