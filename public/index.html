<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShapeLab">
<title>ShapeLab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: vidro sobre o escuro. Coluna única (máx. 640px); peças translúcidas com borda de luz cerúlea de um lado e rosa do outro,
   como vidro iluminado; fundo com bokeh desfocado e um tabuleiro em perspectiva sumindo no escuro; dock em cápsula flutuante.
   Unbounded = marca e títulos (geométrica arredondada), Outfit = interface (geométrica e arredondada), JetBrains Mono = leituras numéricas. */
:root{
  --void:#0A0A0A; --deep:#07090C;
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.08); --glass-3:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --fg:#EEF6FA; --soft:#C3D2DA; --muted:#8392A0; --dim:#4C5763;
  --cer:#007BA7; --cer-hi:#33BFF0; --cer-glow:rgba(0,123,167,.55);
  --rose:#FF2D95; --rose-hi:#FF6CB6; --rose-glow:rgba(255,45,149,.45);
  --good:#46F0A8; --bad:#FF5571;
  --f-disp:"Unbounded","Outfit",system-ui,sans-serif;
  --f-ui:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:24px; --r-sm:16px; --dock-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body{color:var(--fg);font-family:var(--f-ui);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}

/* fundo: bokeh + tabuleiro de vidro em perspectiva */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#0E1620 0%,var(--void) 60%)}
.aura{position:absolute;border-radius:50%;filter:blur(60px)}
.aura.a1{width:60vmax;height:60vmax;background:var(--cer);opacity:.16;top:-30vmax;left:-22vmax;animation:drift 26s ease-in-out infinite alternate}
.aura.a2{width:55vmax;height:55vmax;background:var(--rose);opacity:.08;top:18vh;right:-34vmax;animation:drift 32s ease-in-out infinite alternate-reverse}
.bokeh{position:absolute;border-radius:50%;filter:blur(14px);opacity:.25}
.bokeh.k1{width:90px;height:90px;left:8%;top:24%;background:radial-gradient(circle,rgba(51,191,240,.55),transparent 70%);animation:float 18s ease-in-out infinite alternate}
.bokeh.k2{width:60px;height:60px;right:12%;top:12%;background:radial-gradient(circle,rgba(255,45,149,.55),transparent 70%);animation:float 22s ease-in-out infinite alternate-reverse}
.bokeh.k3{width:120px;height:120px;right:6%;top:58%;background:radial-gradient(circle,rgba(51,191,240,.35),transparent 70%);animation:float 26s ease-in-out infinite alternate}
.bokeh.k4{width:70px;height:70px;left:18%;top:72%;background:radial-gradient(circle,rgba(255,45,149,.4),transparent 70%);animation:float 20s ease-in-out infinite alternate-reverse}
.board{position:absolute;left:-30%;right:-30%;bottom:-8vh;height:52vh;transform-origin:50% 100%;transform:perspective(520px) rotateX(64deg);
  background-image:linear-gradient(rgba(51,191,240,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,45,149,.12) 1px,transparent 1px);background-size:60px 60px;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 85%);mask-image:linear-gradient(to top,#000 0%,transparent 85%);opacity:.55}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes float{to{transform:translate(30px,-40px)}}

.shell{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-block:12px calc(var(--dock-h) + 140px)}

/* topo */
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:600;font-size:19px;letter-spacing:-.02em;line-height:1}
.logo svg{flex:none}
.logo .l1{background:linear-gradient(180deg,#9FE6FF,var(--cer-hi));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .l2{background:linear-gradient(180deg,#FFA6D3,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.sys{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--soft);text-transform:uppercase;white-space:nowrap;
  padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sys{cursor:default}
.sys:focus-visible{outline:2px solid var(--cer-hi);outline-offset:2px}
.led{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.led.on{background:var(--cer-hi);box-shadow:0 0 10px var(--cer-hi)}
.led.rose{background:var(--rose);box-shadow:0 0 10px var(--rose)}
.led.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* tipografia */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sh-t{display:flex;flex-direction:column;gap:8px;min-width:0}
.kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.kicker em{font-style:normal;color:var(--rose-hi)}
.kicker b{color:var(--cer-hi);font-weight:500}
h1{font-family:var(--f-disp);font-weight:600;font-size:22px;letter-spacing:-.015em;margin:0;line-height:1.15;text-wrap:balance;
  background:linear-gradient(180deg,#FFFFFF 30%,#A9C6D4);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--f-ui);font-weight:600;font-size:19px;margin:0;line-height:1.25;text-wrap:balance;letter-spacing:-.005em}
h3{font-family:var(--f-ui);font-weight:600;font-size:17px;margin:0;line-height:1.25}
.lede{color:var(--soft);font-size:15px}
.meta{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}

/* vidro */
.pnl{position:relative;isolation:isolate;border-radius:var(--r);
  background:linear-gradient(160deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.025) 38%,rgba(255,255,255,.015) 70%,rgba(51,191,240,.035) 100%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.35)}
.pnl::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(51,191,240,.32),rgba(255,255,255,.05) 30%,rgba(255,255,255,.03) 65%,rgba(255,45,149,.26));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.pnl::after{content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(70% 50% at 15% 0%,rgba(51,191,240,.06),transparent 70%),radial-gradient(60% 50% at 100% 100%,rgba(255,45,149,.04),transparent 70%)}
.pnl.hot{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.35)}
.pnl.rose-edge::before{background:linear-gradient(135deg,rgba(255,45,149,.45),rgba(255,255,255,.04) 40%,rgba(255,45,149,.2))}

/* botões */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:12px 18px;
  font-family:var(--f-ui);font-weight:600;font-size:13.5px;letter-spacing:.02em;color:var(--fg);
  background:rgba(255,255,255,.045);box-shadow:none;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .2s,box-shadow .2s,transform .12s,border-color .2s}
.b:hover{border-color:rgba(51,191,240,.4);background:rgba(51,191,240,.08)}
.b:active{transform:scale(.97)}
.b:focus-visible{outline:2px solid var(--cer-hi);outline-offset:2px}
.b:disabled{opacity:.4;cursor:default}
.b-pri{border-color:transparent;color:#fff;background:var(--cer);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.b-pri:hover{border-color:transparent;background:#0A8BBB}
.b-rose{border-color:rgba(255,45,149,.4);color:#FFD6EA;background:rgba(255,45,149,.1);box-shadow:none}
.b-rose:hover{border-color:rgba(255,45,149,.7);background:rgba(255,45,149,.16)}
.b-bad{border-color:rgba(255,85,113,.4);color:var(--bad);background:rgba(255,85,113,.06)}
.b-bad:hover{background:rgba(255,85,113,.14);border-color:var(--bad)}
.b.sm{padding:9px 14px;font-size:12.5px}
.b.w{width:100%}
.lnk{background:none;border:0;padding:6px 0;font-family:var(--f-ui);font-weight:600;font-size:13px;color:var(--cer-hi)}
.lnk.mut{color:var(--muted)}
.lnk.bad{color:var(--bad)}
.lnk:focus-visible{outline:2px solid var(--cer-hi);outline-offset:2px;border-radius:6px}
a.lnk,a.b{text-decoration:none}

/* herói */
.hero{display:flex;flex-direction:column;gap:14px;padding:30px 20px 22px}
.hero-t{font-family:var(--f-disp);font-weight:600;font-size:clamp(46px,15vw,80px);line-height:.92;letter-spacing:-.035em;display:flex;flex-direction:column}
.brand-hero{display:flex;flex-direction:column;gap:14px}
.brand-hero svg{filter:drop-shadow(0 0 12px rgba(51,191,240,.2))}
.hero-t .t1{background:linear-gradient(180deg,#D9F5FF 0%,var(--cer-hi) 55%,#0A6F99 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(51,191,240,.22))}
.hero-t .t2{background:linear-gradient(180deg,#FFD3EA 0%,var(--rose) 60%,#B0105F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,45,149,.2))}
.hero .lede{max-width:46ch}

.pstrip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;margin-bottom:12px;border-radius:999px}
.pstrip .mono{font-size:11px;letter-spacing:.08em;color:var(--soft);text-transform:uppercase}
.pstrip .mono span{color:var(--cer-hi)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

/* ficha */
.rc{padding:18px 18px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.rc-head{display:flex;gap:14px;align-items:center}
.glyph{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:26px;line-height:1;color:#fff;
  background:linear-gradient(145deg,rgba(0,123,167,.55),rgba(0,123,167,.22) 55%,rgba(255,45,149,.3));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.08)}
.rc-head > div{min-width:0;display:flex;flex-direction:column;gap:4px}
.readout{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;border-radius:18px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px var(--line)}
.readout li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 10px;font-size:14.5px;border-radius:12px}
.readout li:nth-child(odd){background:rgba(255,255,255,.025)}
.readout .ro-n{font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
.readout .ro-name{overflow-wrap:anywhere}

.readout .ro-v{font-family:var(--f-mono);font-size:12px;color:var(--soft);white-space:nowrap}
.readout li.more{grid-template-columns:1fr;color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em}
.rc-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rc-actions .b-pri{grid-column:1/-1}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(3,5,8,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{position:relative;width:100%;max-width:640px;max-height:94%;display:flex;flex-direction:column;border-radius:28px 28px 0 0;
  background:linear-gradient(180deg,rgba(24,30,38,.96),rgba(12,14,18,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -20px 60px rgba(0,0,0,.5);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-panel::before{content:"";position:absolute;inset:0 0 auto;height:1px;border-radius:28px 28px 0 0;background:linear-gradient(90deg,transparent,rgba(51,191,240,.7),rgba(255,45,149,.6),transparent)}
.sheet-panel::after{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:rgba(255,255,255,.18)}
.sheet.full .sheet-panel{height:94%}
.sheet-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;padding:20px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet-head h2{text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);font-weight:500}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--glass);font-size:15px;display:grid;place-items:center}
.ib:focus-visible{outline:2px solid var(--cer-hi);outline-offset:2px}
.sheet-body{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sheet-foot .b{flex:1}
.sheet-foot:empty{display:none}

/* campos */
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fld > span{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;min-width:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
select{appearance:auto}
input::placeholder,textarea::placeholder{color:var(--dim)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #15191f inset;-webkit-text-fill-color:var(--fg);caret-color:var(--fg);transition:background-color 9999s}
input,select,textarea{font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(51,191,240,.65);background:rgba(51,191,240,.07);box-shadow:0 0 0 3px rgba(51,191,240,.15)}

/* editor */
.exed{padding:14px;display:flex;flex-direction:column;gap:10px}
.exed-top{display:flex;gap:8px;align-items:center}
.exed-top input{font-weight:600;font-size:15.5px}
.exed-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tagline{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cer-hi)}
.tagline.p{color:var(--rose-hi)}
.mini{display:flex;gap:4px;flex:none}
.mini button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--muted);font-size:13px}
.mini button:hover{color:var(--fg);border-color:var(--cer-hi)}
.exed-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.exed-grid label{display:flex;flex-direction:column;gap:5px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
.exed-grid input,.exed-grid select{font-family:var(--f-mono);font-size:14px;padding:10px 8px;border-radius:12px}

/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;background:var(--glass);padding:8px 13px;font-size:13px;font-weight:500;color:var(--soft);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:all .18s}
.chip:hover{border-color:rgba(51,191,240,.55);color:var(--fg)}
.chip.on{background:rgba(0,123,167,.3);border-color:rgba(51,191,240,.55);color:#fff}
.chip.rs:hover,.chip.rs.on{border-color:rgba(255,45,149,.55);background:rgba(255,45,149,.14);color:#fff}
.flt-l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:-6px}

/* biblioteca */
.lib{display:flex;flex-direction:column;gap:6px}
.li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px;border-radius:18px;background:rgba(255,255,255,.025);box-shadow:inset 0 0 0 1px var(--line)}
.li-main{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.li-main b{font-weight:600}
.li-tags{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.li-tags i{font-style:normal;color:var(--rose-hi)}
.li-add{border:1px solid rgba(51,191,240,.35);width:40px;height:40px;border-radius:50%;background:rgba(51,191,240,.1);color:#fff;font-size:18px;font-weight:600}
.cues-l{grid-column:1/-1;margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.cues-l li{font-size:13.5px;color:var(--soft);display:grid;grid-template-columns:24px 1fr;gap:6px;line-height:1.4}
.cues-l li::before{content:attr(data-n);font-family:var(--f-mono);font-size:10px;color:var(--rose-hi);padding-top:3px}

/* IA */
.ai-out{padding:18px 16px 16px;font-size:14.5px;line-height:1.55}
.ai-out .tagx{position:absolute;top:10px;right:14px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;color:var(--rose-hi)}
.ai-out ul{margin:6px 0;padding-left:18px}
.ai-out p + p,.ai-out p + ul,.ai-out ul + p{margin-top:8px}
.err{color:var(--bad);font-size:13.5px}
.ok{color:var(--good);font-size:13.5px}
.code-box{font-family:var(--f-mono);font-size:11.5px;word-break:break-all}

/* questionário */
.qprog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.qprog i{height:5px;border-radius:5px;background:rgba(255,255,255,.08)}
.qprog i.on{background:linear-gradient(90deg,var(--cer-hi),var(--rose));box-shadow:0 0 10px rgba(51,191,240,.45)}
.qq{font-family:var(--f-disp);font-weight:600;font-size:19px;line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:38px minmax(0,1fr) 24px;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:20px;
  border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:all .2s}
.opt:hover{border-color:var(--line-2)}
.opt:focus-visible{outline:2px solid var(--cer-hi);outline-offset:2px}
.opt .ix{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line)}
.opt b{display:block;font-weight:600;font-size:16px}
.opt small{color:var(--muted);font-size:13px}
.opt .mk{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-2);justify-self:end}
.opt.on{border-color:rgba(51,191,240,.7);background:linear-gradient(160deg,rgba(51,191,240,.22),rgba(0,123,167,.06) 60%,rgba(255,45,149,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.opt.on .ix{color:#fff;background:var(--cer);box-shadow:0 0 12px var(--cer-glow)}
.opt.on .mk{background:radial-gradient(circle,#fff 0 3px,var(--cer-hi) 4px);box-shadow:0 0 12px var(--cer-hi)}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.why li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14.5px;color:var(--soft)}
.why li::before{content:"";width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--cer-hi);box-shadow:0 0 8px var(--cer-hi)}
.plan-day{padding:14px 16px}
.plan-day ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.plan-day li{font-size:14px;color:var(--soft);display:flex;justify-content:space-between;gap:10px}
.plan-day li span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.plan-day li.p{color:var(--fg)}
.plan-day li span.imp-n{font-family:var(--f-ui);font-size:14.5px;color:var(--fg);white-space:normal;min-width:0;overflow-wrap:anywhere}
.imp-n small{display:block;font-size:12px;color:var(--muted)}
.imp-n small.unk{color:var(--rose-hi)}
.plan-day li{align-items:center}
.plan-day .exed-top input{font-weight:600}


/* treino ao vivo */
.pick-r{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:var(--r);
  border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:all .2s}
.pick-r:hover,.pick-r:focus-visible{outline:none;border-color:rgba(51,191,240,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 26px rgba(51,191,240,.18)}
.pick-r .glyph{width:46px;height:46px;font-size:20px;border-radius:15px}
.pick-r .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pick-r small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.pick-r .go{font-weight:600;font-size:13px;color:var(--cer-hi)}
.reactor{display:grid;grid-template-columns:136px minmax(0,1fr);gap:18px;align-items:center;padding:18px;margin-bottom:14px}
.ring{position:relative;width:136px;height:136px}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),rgba(51,191,240,.06) 45%,rgba(255,45,149,.06) 80%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.ring svg{position:relative;width:100%;height:100%;display:block;transform:rotate(-90deg)}
.ring .tk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2;stroke-linecap:round}
.ring .tr{fill:none;stroke:rgba(255,255,255,.07);stroke-width:8}
.ring .pg{fill:none;stroke:url(#rg);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-c b{font-family:var(--f-mono);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.ring-c small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;color:var(--muted)}
.reactor-i{display:flex;flex-direction:column;gap:9px;min-width:0}
.reactor-i h2{font-family:var(--f-disp);font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.3}
.xm{padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.xm.complete::before{background:linear-gradient(135deg,rgba(70,240,168,.7),rgba(255,255,255,.05) 40%,rgba(70,240,168,.35))}
.xm-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.xm-n{font-family:var(--f-mono);font-size:11px;color:var(--cer-hi);padding:4px 8px;border-radius:999px;background:rgba(51,191,240,.12);box-shadow:inset 0 0 0 1px rgba(51,191,240,.3)}
.xm.complete .xm-n{color:var(--good);background:rgba(70,240,168,.1);box-shadow:inset 0 0 0 1px rgba(70,240,168,.35)}
.segs{display:grid;gap:5px}
.segs i{height:5px;border-radius:5px;background:rgba(255,255,255,.08)}
.segs i.on{background:linear-gradient(90deg,var(--cer),var(--cer-hi));box-shadow:0 0 10px var(--cer-glow)}
.xm.complete .segs i.on{background:var(--good);box-shadow:0 0 10px rgba(70,240,168,.5)}
.last{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.last b{color:var(--rose-hi);font-weight:500}
.note-l{font-size:13.5px;color:var(--soft);padding:8px 12px;border-radius:12px;background:rgba(51,191,240,.07);box-shadow:inset 0 0 0 1px rgba(51,191,240,.18)}
.sets{display:flex;flex-direction:column;gap:7px}
.sets-h,.srow{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 50px;gap:10px;align-items:center}
.sets-h span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:center}
.srow .sl{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.srow input{font-family:var(--f-mono);font-size:18px;font-weight:500;text-align:center;padding:10px 4px;font-variant-numeric:tabular-nums}
.chk{width:46px;height:46px;justify-self:center;border-radius:50%;border:1px solid var(--line-2);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),rgba(255,255,255,.03));color:var(--dim);font-size:18px;font-weight:700;transition:all .2s}
.chk:focus-visible{outline:2px solid var(--cer-hi);outline-offset:2px}
.srow.done .chk{border-color:transparent;color:#fff;background:var(--cer);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.srow.done input{color:var(--cer-hi);border-color:rgba(51,191,240,.4);background:rgba(51,191,240,.08)}
.srow.done .sl{color:var(--cer-hi)}
.xm-foot{display:flex;gap:18px}
.xm.collapsed{padding:8px 10px;gap:0}
.xm.skipped{opacity:.6}
.xm.skipped::before{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.xm-n.sk{color:var(--muted);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line)}
.xm-col{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:4px;border-radius:16px}
.xm-col:focus-visible{outline:2px solid var(--cer-hi);outline-offset:2px}
.xm-cm{display:flex;flex-direction:column;gap:2px;min-width:0}
.xm-cm b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xm-cm small{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* descanso */
.rest{position:fixed;left:0;right:0;bottom:calc(var(--dock-h) + 20px + env(safe-area-inset-bottom,0px));z-index:45;
  padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.rest-in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px 8px 10px;border-radius:999px;
  background:rgba(24,14,22,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(255,45,149,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45)}
.rring{width:46px;height:46px;transform:rotate(-90deg);overflow:visible;justify-self:center}
.rring .tr{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3.5}
.rring .pg{fill:none;stroke:var(--rose-hi);stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rest-t small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;color:var(--rose-hi)}
.rest-t b{font-family:var(--f-mono);font-size:23px;font-weight:500;font-variant-numeric:tabular-nums}
.rest-b{display:flex;gap:5px}
.rest-b button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:999px;padding:9px 10px;font-family:var(--f-mono);font-size:11px;color:var(--fg)}
.rest.go .rest-in{background:rgba(10,30,22,.94);border-color:rgba(70,240,168,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45)}
.rest.go .rest-t small{color:var(--good)}
.rest.cd .rest-in{background:rgba(48,8,14,.95);border-color:var(--bad);animation:cdpulse 1s ease-in-out infinite}
.rest.cd .rring .pg{stroke:var(--bad)}
.rest.cd .rest-t small,.rest.cd .rest-t b{color:#FF8A96}
@keyframes cdpulse{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 4px rgba(255,85,113,.18),0 10px 30px rgba(0,0,0,.45)}}
.rest.go .rring .pg{stroke:var(--good);filter:none}
.rest.go .rring .tr{stroke:rgba(70,240,168,.25)}
.rest.go .rest-b button[data-a="restMinus"],.rest.go .rest-b button[data-a="restPlus"],.rest.go .rest-b button[data-a="sound"]{display:none}
.rest.go .rest-b button[data-a="restSkip"]{border-color:rgba(70,240,168,.5);color:var(--good);padding:9px 16px}
.rest-t{min-width:0}
.rest-t small,.rest-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rest.go .rest-t b{font-family:var(--f-disp);font-size:19px;font-weight:600}

/* evolução */
.readouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.ro{padding:14px;min-width:0;border-radius:20px}
.ro small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ro b{display:block;font-family:var(--f-disp);font-weight:600;font-size:20px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro b span{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);margin-left:4px}
.blk{padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-nav b{font-family:var(--f-disp);font-weight:600;font-size:15px}
.cal-nav .ib:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal > span{font-family:var(--f-mono);font-size:10px;color:var(--dim);text-align:center;padding-bottom:2px}
.cal i{font-style:normal;aspect-ratio:1;border-radius:10px;position:relative;display:grid;place-items:center}
.cal-d{background:rgba(255,255,255,.04)}
.cal-d small{position:absolute;top:3px;left:5px;font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.cal-d b{font-family:var(--f-disp);font-weight:600;font-size:15px;color:#fff}
.cal-d.on{background:linear-gradient(145deg,rgba(0,123,167,.75),rgba(0,123,167,.4));box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.cal-d.on small{color:rgba(255,255,255,.7)}
.cal-d.fut{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.cal-d.today{box-shadow:0 0 0 1.5px var(--rose)}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--soft)}
.cal-leg b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:rgba(0,123,167,.55);color:#fff;font-family:var(--f-disp);font-size:11px;margin-right:4px}
.hm-wrap{display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px}
.hm-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-family:var(--f-mono);font-size:8.5px;color:var(--dim);align-items:center}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.hm i{display:block;aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.05)}
.hm i.l1{background:rgba(0,123,167,.65)}
.hm i.l2{background:var(--cer-hi);box-shadow:0 0 8px var(--cer-glow)}
.hm i.fut{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.hm i.today{box-shadow:0 0 0 1.5px var(--rose),0 0 8px var(--rose-glow)}
.wk{display:grid;gap:6px}
.wk i{height:9px;border-radius:9px;background:rgba(255,255,255,.07)}
.wk i.on{background:linear-gradient(90deg,var(--rose),var(--rose-hi));box-shadow:0 0 10px var(--rose-glow)}
.vb{display:flex;flex-direction:column;gap:9px}
.vb-r{display:grid;grid-template-columns:92px minmax(0,1fr) 74px;gap:10px;align-items:center;font-size:13.5px}
.vb-r span:first-child{color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb-t{height:9px;border-radius:9px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.vb-t i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:linear-gradient(90deg,var(--cer),var(--cer-hi));box-shadow:0 0 10px var(--cer-glow)}
.vb-r span:last-child{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right}
.evo svg{width:100%;height:auto;display:block;overflow:visible}
.evo .ax{fill:var(--dim);font-size:9px;font-family:var(--f-mono)}
.evo .gl{stroke:rgba(255,255,255,.06);stroke-dasharray:2 5}
.evo .ln{fill:none;stroke:url(#lg);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(51,191,240,.6))}
.evo .ar{fill:url(#af)}
.evo .pt{fill:var(--void);stroke:var(--cer-hi);stroke-width:1.8}
.evo .pt.last{fill:var(--rose);stroke:var(--rose)}
.evo .lbl{fill:var(--rose-hi);font-size:10.5px;font-family:var(--f-mono)}
.sess{margin-bottom:8px;border-radius:20px}
.sess summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:13px 16px;cursor:pointer;align-items:center;border-radius:20px}
.sess summary::-webkit-details-marker{display:none}
.sess summary:focus-visible{outline:2px solid var(--cer-hi);outline-offset:-2px}
.sess .d{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sess .v{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.sess-b{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sess-b .lx{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:7px}
.sess-b .lx span:last-child{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right}

/* coach */
.console{padding:0;margin-bottom:12px}
.con-h{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.con-h b{color:var(--rose-hi);font-weight:500}
.con-log{padding:16px;display:flex;flex-direction:column;gap:12px}
.tx{display:flex;flex-direction:column;gap:5px;max-width:92%}
.tx.me{align-self:flex-end;align-items:flex-end}
.tx .who{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:0 6px}
.tx.me .who{color:var(--cer-hi)}
.tx.ai .who{color:var(--rose-hi)}
.tx .body{font-size:14.5px;line-height:1.6;overflow-wrap:anywhere;padding:11px 14px;border-radius:20px}
.tx.me .body{color:#fff;background:linear-gradient(180deg,#22A7DA,var(--cer));border-bottom-right-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px rgba(0,123,167,.3)}
.tx.ai .body{color:var(--soft);background:rgba(255,255,255,.05);border-bottom-left-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,45,149,.25)}
.tx.ai .body ul{margin:6px 0;padding-left:18px}
.tx.ai .body p + p,.tx.ai .body p + ul,.tx.ai .body ul + p{margin-top:8px}
.caret::after{content:"";display:inline-block;width:7px;height:7px;margin-left:6px;border-radius:50%;background:var(--rose);box-shadow:0 0 8px var(--rose);animation:blink 1s ease-in-out infinite}
.cmd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;padding:12px;border-top:1px solid var(--line)}
.cmd .pr{display:none}
.cmd textarea{min-height:46px;max-height:140px;resize:none;border-radius:22px;padding:12px 16px}
.unavail{padding:16px;color:var(--soft);font-size:14.5px;margin-bottom:14px}
.prof{padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}

/* demonstração */
.demo{position:relative;aspect-ratio:1;overflow:hidden;min-width:0;border-radius:18px;
  background:radial-gradient(70% 60% at 50% 70%,rgba(51,191,240,.16),transparent 70%),radial-gradient(50% 40% at 85% 10%,rgba(255,45,149,.12),transparent 70%),rgba(0,0,0,.35);
  box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.1)}
.demo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 3px rgba(51,191,240,.55))}
.demo img,.demo video{width:100%;height:100%;object-fit:cover;display:block}
.demo .dm-tag{position:absolute;left:8px;top:7px;font-family:var(--f-mono);font-size:8px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.demo .dm-tag.own{color:var(--rose-hi)}
.demo.ph{background:#111}
.demo.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.exec-big .demo.ph{aspect-ratio:3/2}
.exec-big:has(.demo.ph){width:100%}
.demo.ph img.f2{animation:phflip 2.4s steps(1) infinite}
.demo.ph svg{display:none}
.demo.ph.noph img{display:none}
.demo.ph.noph svg{display:block}
@keyframes phflip{0%{opacity:0}50%{opacity:1}}
.dm-fl{stroke:rgba(51,191,240,.3);stroke-width:1;stroke-dasharray:3 4}
.dm-pr{fill:none;stroke:#5E7480;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dm-wall{fill:rgba(255,255,255,.03);stroke:rgba(51,191,240,.15)}
.dm-lb,.dm-tr{fill:none;stroke:var(--cer-hi);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
.dm-tr{stroke-width:5.4}
.dm-lf{fill:none;stroke:#1E6A86;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.dm-hd{fill:var(--void);stroke:var(--cer-hi);stroke-width:3}
.dm-jt{fill:var(--rose)}
.dm-eq{fill:none;stroke:var(--fg);stroke-width:2.4}
.dm-eqf{fill:var(--fg)}
.dm-cb{stroke:var(--muted);stroke-width:1.2}
.dm-bd{stroke:var(--rose);stroke-width:2;stroke-dasharray:4 2}
.exec{display:grid;grid-template-columns:116px minmax(0,1fr);gap:14px;align-items:start}
.exec .cues-l{margin:0}
.exec-links{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.exec-big{width:min(280px,72vw);margin:0 auto}
.li .demo{width:56px;border-radius:14px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
/* véu suave atrás do menu de baixo: o conteúdo vai ficando levemente desfocado e escuro ao passar por baixo */
.dock::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--dock-h) + 52px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:-1;

const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

function streakInfo(extraSessions) {
  const ss = extraSessions || S.sessions, target = clamp(+S.state.profile.days || 3, 1, 7);
  const ws = weekStart(new Date());
  const daysOf = w => { const a = new Date(ws); a.setDate(a.getDate() - 7 * w); const b = new Date(a); b.setDate(b.getDate() + 7);
    return new Set(ss.filter(s => { const d = new Date(s.date); return d >= a && d < b; }).map(s => dayKey(new Date(s.date)))); };
  const oldest = ss.length ? weekStart(new Date(ss.reduce((m, s) => s.date < m ? s.date : m, ss[0].date))) : ws;
  const nW = Math.max(0, Math.round((ws - oldest) / 6048e5));
  // cada dia treinado = +1. Semana encerrada abaixo da meta apaga a ofensiva, a não ser que haja proteção.
  let run = 0, best = 0, shields = 1, sinceEarn = 0;
  for (let w = nW; w >= 1; w--) {
    const n = daysOf(w).size;
    if (n >= target) { run += n; sinceEarn++; if (sinceEarn >= 4) { shields = Math.min(2, shields + 1); sinceEarn = 0; } }
    else if (run > 0 && shields > 0) { shields--; run += n; }
    else { best = Math.max(best, run + n); run = 0; sinceEarn = 0; }
    best = Math.max(best, run);
  }
  const cur = daysOf(0), c0 = cur.size, met0 = c0 >= target;
  const streak = run + c0;
  best = Math.max(best, streak);
  const today = new Date(), dow = (today.getDay() + 6) % 7, daysLeft = 7 - dow;
  const trainedToday = cur.has(dayKey(today));
  const remaining = Math.max(0, target - c0);
  const left = daysLeft - (trainedToday ? 1 : 0);
  const days = Array.from({length: 7}, (_, i) => { const d = new Date(ws); d.setDate(ws.getDate() + i); return {on: cur.has(dayKey(d)), today: i === dow, fut: i > dow}; });

  else if (remaining <= left) { msg = `Faltam ${plural(remaining, "treino", "treinos")} até domingo para manter sua ofensiva acesa.`; cls = "risk"; }
  else { msg = shields > 0 ? "A meta desta semana não fecha mais. Uma proteção será usada e sua ofensiva continua." : "A meta desta semana não fecha mais. A ofensiva apaga no domingo."; cls = shields > 0 ? "" : "risk"; }

}

function quizOpt(val) {

function applySwap(name) {
  const L = byName(name), {ctx, i} = swapCtx;
  const base = L ? {name: L.name, group: L.group, pattern: L.pattern} : {name, group: "Outro", pattern: ""};
  if (ctx === "edit") {
    Object.assign(draft.exercises[i], base, {note: ""});
    swapCtx = null; renderEditor(); return;
  }
  const e = active.ex[i], old = e.name;
  const doneSets = e.sets.filter(s => s.done);
  Object.assign(e, base, {note: ""});
  e.sets = [...doneSets, ...liveSets({name: e.name, load: ""}, Math.max(1, e.sets.length - doneSets.length))];
  if (swapAlso) {
    const r = S.state.routines.find(x => x.id === active.routineId);
    const re = r && r.exercises.find(x => x.name === old);
    if (re) { Object.assign(re, base, {note: ""}); saveState(); }
  }
  saveActive(); closeSheet(); toast(swapAlso ? "Trocado hoje e na ficha" : "Trocado só para hoje"); renderTreino();
}

const IMP_GROUP = [[/peit|supino|crucifixo|voador|crossover|fly/, "Peito"], [/costa|remada|puxada|pulldown|barra fixa|serrote|pullover/, "Costas"],
  [/ombro|desenvolv|elevacao (lateral|frontal)|face pull|deltoide|encolhimento/, "Ombros"], [/biceps|rosca/, "Bíceps"], [/triceps|testa|frances|mergulho/, "Tríceps"],
  [/agach|leg|extensora|afundo|passada|hack|quadricep|bulgaro/, "Quadríceps"], [/flexora|stiff|terra|posterior|isquio|good morning/, "Posterior"],
  [/glute|pelvica|abdut|coice|ponte|hip/, "Glúteos"], [/panturrilha|gemeos/, "Panturrilha"], [/abdom|prancha|core|obliquo|infra/, "Core"],
  [/esteira|bike|bicicleta|eliptico|corrida|escada|cardio|hiit/, "Cardio"], [/along|mobilidade|liberacao/, "Mobilidade"]];
function impMatch(raw) {
  const n = NRM(raw);
  if (!n) return null;
  const exact = LIB.find(x => NRM(x.name) === n); if (exact) return exact;
  for (const [re, name] of IMP_SYN) if (re.test(n)) { const L = LIB.find(x => x.name === name); if (L) return L; }
  const toks = s => NRM(s).split(" ").filter(w => w.length > 1 && !IMP_STOP.has(w));
  const a = toks(raw); if (!a.length) return null;
  let best = null, bs = 0;
  for (const L of LIB) {
    const b = toks(L.name); const hit = a.filter(w => b.some(v => v === w || (w.length > 4 && v.startsWith(w.slice(0, 5))))).length;
    const sc = 2 * hit / (a.length + b.length); if (sc > bs) { bs = sc; best = L; }
  }

function evoChart(name) {
  const P = [];
  for (const s of [...S.sessions].reverse()) {
    const ex = (s.exercises || []).find(e => e.name === name);
    if (ex && ex.sets.length) P.push({d: s.date, v: Math.max(...ex.sets.map(x => Number(x.load) || 0))});
  }
  const pts = P.slice(-12);
  if (pts.length < 2) return `<p class="meta">Registre esse exercício em pelo menos 2 sessões para ver a curva.${pts.length ? ` Atual: ${fmt(pts[0].v)}kg.` : ""}</p>`;
  const W = 320, H = 150, L = 32, R = 16, T = 18, B = 22;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (lo === hi) { lo = Math.max(0, lo - 5); hi += 5; }
  const step = Math.max(1, Math.ceil((hi - lo) / 3 / 2.5) * 2.5);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
  const x = i => L + i * (W - L - R) / (pts.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const ticks = []; for (let t = lo; t <= hi + 1e-9; t += step) ticks.push(t);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length - 1).toFixed(1)},${H - B} L${L},${H - B} Z`;
  const last = pts[pts.length - 1], first = pts[0];
  const sd = d => new Date(d).toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit"});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carga máxima de ${esc(name)} por sessão">
    <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#2BB8EA"/><stop offset="1" stop-color="#FF2D95"/></linearGradient>
    <linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#007BA7" stop-opacity=".32"/><stop offset="1" stop-color="#007BA7" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${fmt(t)}</text>`).join("")}
    <path class="ar" d="${area}"/><path class="ln" d="${line}"/>
    ${pts.map((p, i) => `<circle class="pt ${i === pts.length - 1 ? "last" : ""}" cx="${x(i)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 4.5 : 2.8}"/>`).join("")}
    <text class="lbl" x="${x(pts.length - 1)}" y="${y(last.v) - 10}" text-anchor="end">${fmt(last.v)}KG</text>
    <text class="ax" x="${L}" y="${H - 5}">${sd(first.d)}</text><text class="ax" x="${W - R}" y="${H - 5}" text-anchor="end">${sd(last.d)}</text></svg>`;
}

  h += `<div class="pnl console"><div class="con-h"><span class="led rose ${chatBusy ? "blink" : ""}"></span>Coach <b>IA</b> · online</div>
    <div class="con-log" id="chat"><div class="tx ai"><span class="who">Coach</span><div class="body"><p>Oi, ${esc(S.state.profile.name || "tudo bem")}! Eu conheço suas fichas, seu perfil e seus últimos treinos. Pergunte o que quiser sobre o seu treino, ou toque numa das sugestões abaixo.</p></div></div>
    ${chat.map(m => `<div class="tx ${m.role === "user" ? "me" : "ai"}"><span class="who">${m.role === "user" ? "Você" : "Coach"}</span><div class="body">${m.role === "user" ? esc(m.content) : mdLite(m.content)}</div></div>`).join("")}</div>
    ${sampleFn ? `<form class="cmd" id="askForm"><textarea id="askIn" rows="1" placeholder="Pergunte sobre seu treino…" aria-label="Mensagem para o coach"></textarea><button class="b b-pri sm" id="askBtn" type="submit">Enviar</button></form>` : ""}</div>
    ${sampleFn ? `<p class="flt-l" style="margin:6px 0 12px">Sugestões para você</p><div class="chips">${quickPrompts().map(q => `<button class="chip rs" data-a="quick" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}`;
  $("#v-coach").innerHTML = h;
}
async function ask(text) {
  if (chatBusy || !sampleFn || !text.trim()) return;
  chatBusy = true;
  chat.push({role: "user", content: text.trim()});
  const box = $("#chat");
  box.insertAdjacentHTML("beforeend", `<div class="tx me"><span class="who">Você</span><div class="body">${esc(text.trim())}</div></div><div class="tx ai" id="pending"><span class="who">Coach</span><div class="body caret">Processando</div></div>`);
  const pend = $("#pending"), body = pend.querySelector(".body");
  pend.scrollIntoView({block: "end", behavior: "smooth"});
  const btn = $("#askBtn"); if (btn) { btn.textContent = "Parar"; btn.dataset.stop = "1"; }
  if (aiAbort) aiAbort.abort(); aiAbort = new AbortController();
  const rules = `Você é o Coach do app de treino ShapeLab, focado em quem passa muitas horas sentado (postura, cadeia posterior, quadril e escápulas). Responda em português do Brasil, direto e prático, em até ~150 palavras salvo se pedirem mais. Use tópicos curtos quando ajudar. Quem decide o treino é o usuário ou o personal dele: sugira, não imponha. Se houver dor forte, lesão ou condição médica, recomende avaliação com um profissional. Baseie-se no contexto:

${contextText()}`;
  try {
    const {text: ans} = await sampleFn([{role: "user", content: rules}, ...chat.slice(-12)], {cache: false, signal: aiAbort.signal, onText: ({text}) => { body.classList.remove("caret"); body.innerHTML = mdLite(text); }});
    chat.push({role: "assistant", content: ans});
  } catch (e) {
    body.classList.remove("caret");
    if (e && e.text) { chat.push({role: "assistant", content: e.text}); body.innerHTML = mdLite(e.text); }
    else { chat.pop(); body.innerHTML = ""; }
    if (e && e.code !== "cancelled") body.insertAdjacentHTML("beforeend", `<p class="err">${esc(aiErr(e))}</p>`);
    else if (!(e && e.text)) pend.remove();
  }
  pend.removeAttribute("id");
  chatBusy = false;
  const b = $("#askBtn"); if (b) { b.textContent = "Enviar"; delete b.dataset.stop; }
}

/* ============ ações ============ */
const actions = {
  tab: b => setTab(b.dataset.t),
  quiz: () => openQuiz(),
  qopt: b => quizOpt(b.dataset.v),
  qprev: () => { if (quiz.step) { quiz.step--; renderQuiz(); } else closeSheet(); },
  qnext: () => quizNext(),
  planReplace: () => { if (active) { toast("Finalize o treino em andamento antes."); return; } S.state.routines = plan.routines; saveState(); closeSheet(); toast("Plano salvo"); setTab("fichas"); },
  planAdd: () => { S.state.routines.push(...plan.routines); saveState(); closeSheet(); toast("Plano adicionado"); setTab("fichas"); },
  new: () => openEditor(null),
  edit: b => openEditor(b.dataset.id),
  dupe: b => { const r = S.state.routines.find(x => x.id === b.dataset.id); if (!r) return; const c = clone(r); c.id = uid(); c.name = r.name + " (cópia)"; c.exercises.forEach(e => e.id = uid()); S.state.routines.push(c); saveState(); toast("Ficha duplicada"); renderCurrent(); },
  start: b => { ensureAudio(); startWorkout(b.dataset.id); },
  browse: () => openPicker("browse"),
  pdfAll: () => exportPdf(null),
  pdfOne: b => exportPdf([b.dataset.id]),
  aiBuild: () => openAiBuild(),
  aiChip: b => { $("#aiReq").value = b.dataset.c; },
  aiGen: () => aiGenerate(),
  aiUse: () => { if (aiResult) openEditor(null, {...aiResult, id: uid()}); },
  sheetBack: () => { if (sheetBack === "editor" && draft) renderEditor(); else if (sheetBack === "swap" && swapCtx) openSwap(swapCtx.ctx, swapCtx.i); else if (sheetBack === "picker") openPicker(pk.mode, true); else closeSheet(); },
  pick: () => openPicker("add"),
  pg: b => { pk.g = b.dataset.g; renderPickList(); },
  pe: b => { pk.eq = b.dataset.e; renderPickList(); },
  pp: () => { pk.post = !pk.post; renderPickList(); },
  pkOpen: b => { pk.open = pk.open === b.dataset.n ? "" : b.dataset.n; renderPickList(); },
  addEx: b => {
    const L = byName(b.dataset.n);
    draft.exercises.push(L ? mkFromLib(L, null, S.state.profile) : {id: uid(), name: b.dataset.n, group: "Outro", pattern: "", sets: 3, reps: "10-12", load: "", rest: 60, note: ""});
    renderEditor(); setTimeout(() => { const s = $("#sheetBody"); s.scrollTop = s.scrollHeight; }, 0);
  },
  up: b => { const i = +b.dataset.i, a = draft.exercises; if (i > 0) { [a[i - 1], a[i]] = [a[i], a[i - 1]]; renderEditor(); } },
  down: b => { const i = +b.dataset.i, a = draft.exercises; if (i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; renderEditor(); } },
  rm: b => { draft.exercises.splice(+b.dataset.i, 1); renderEditor(); },
  swapEd: b => openSwap("edit", +b.dataset.i),
  swapLive: b => { swapAlso = false; openSwap("live", +b.dataset.i); },
  swapScope: b => { swapAlso = b.dataset.s === "1"; openSwap(swapCtx.ctx, swapCtx.i); },
  swapTo: b => applySwap(b.dataset.n),
  swapLib: () => openPicker("swap"),
  saveRoutine: () => saveRoutine(),
  review: () => aiReview(),
  delRoutine: () => { if (!delArm) { delArm = true; renderEditor(); return; } S.state.routines = S.state.routines.filter(r => r.id !== draft.id); saveState(); closeSheet(); toast("Ficha excluída"); renderCurrent(); },
  calPrev: () => { calM--; renderHistorico(); },
  calNext: () => { if (calM < 0) calM++; renderHistorico(); },
  import: () => openImport(),
  impRead: () => { const t = $("#impText"); if (t) imp.text = t.value; impRead(); },
  impAI: () => { const t = $("#impText"); if (t) imp.text = t.value; impAI(); },
  impBack: () => { imp.routines = null; renderImport(); },
  impSave: () => impSave(),
  impDel: b => { const r = imp.routines[+b.dataset.r]; r.exercises.splice(+b.dataset.e, 1); imp.routines = imp.routines.filter(x => x.exercises.length); if (!imp.routines.length) imp.routines = null; renderImport(); },
  toggleSet: b => {
    if (active && active.pausedAt) resumeWorkout();
    ensureAudio(); keepAwake();
    const e = active.ex[+b.dataset.i], s = e.sets[+b.dataset.k];
    s.done = !s.done;
    if (s.done) { if (!String(s.reps).trim()) s.reps = repsTarget(e.reps); startRest(S.state.settings.rest === "ficha" ? e.rest : +S.state.settings.rest); }
    const nowDone = e.sets.every(x => x.done);
    if (nowDone && s.done) e.open = !S.state.settings.collapse;
    saveActive(); discardArm = false; renderTreino();
    if (nowDone && s.done) {
      const i = +b.dataset.i, next = active.ex.findIndex((x, j) => j > i && !x.sets.every(y => y.done));
      const el = next >= 0 ? $("#xm-" + next) : $("#xm-" + i);
      if (el) el.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "start"});
    }
  },
  skipEx: b => {
    const i = +b.dataset.i, e = active.ex[i];
    e.skipped = true; e.sets.forEach(x => x.done = false); rest = null;
    saveActive(); renderTreino(); tick(); toast(`${e.name} pulado`);
    const next = active.ex.findIndex((x, j) => j > i && !x.skipped && !x.sets.every(y => y.done));
    const el = $("#xm-" + (next >= 0 ? next : i)); if (el) el.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "start"});
  },
  unskipEx: b => { active.ex[+b.dataset.i].skipped = false; saveActive(); renderTreino(); },
  xmOpen: b => { active.ex[+b.dataset.i].open = true; saveActive(); renderTreino(); },
  xmClose: b => { active.ex[+b.dataset.i].open = false; saveActive(); renderTreino(); },
  addSet: b => { const e = active.ex[+b.dataset.i], l = e.sets[e.sets.length - 1]; e.sets.push({load: l ? l.load : "", reps: "", done: false}); saveActive(); renderTreino(); },
  rmSet: b => { const e = active.ex[+b.dataset.i]; if (e.sets.length > 1) e.sets.pop(); saveActive(); renderTreino(); },
  aiLoads: () => aiLoads(),
  finish: () => { resumeWorkout(); finishWorkout(); },
  pauseW: () => pauseWorkout(),
  resumeW: () => resumeWorkout(),
  stopW: () => {
    const done = active ? active.ex.reduce((t, e) => t + e.sets.filter(x => x.done).length, 0) : 0;
    openSheet("Parar treino",
      `<p class="lede">${done ? `Você já marcou <b>${done} ${done === 1 ? "série" : "séries"}</b>. Quer salvar o que fez até aqui ou descartar o treino?` : "Nenhuma série marcada ainda. Parar agora descarta este treino."}</p>`,
      `${done ? `<button class="b b-bad" data-a="stopDiscard">Descartar</button><button class="b b-pri" data-a="stopSave">Salvar e encerrar</button>` : `<button class="b" data-a="sheetBack">Continuar</button><button class="b b-bad" data-a="stopDiscard">Parar e descartar</button>`}`);
  },
  stopSave: () => { closeSheet(); resumeWorkout(); finishWorkout(); },
  stopDiscard: () => { closeSheet(); active = null; rest = null; saveRest(); saveActive(); releaseAwake(); toast("Treino encerrado"); renderCurrent(); },
  discard: () => { if (!discardArm) { discardArm = true; renderTreino(); return; } active = null; rest = null; saveRest(); discardArm = false; saveActive(); releaseAwake(); toast("Treino descartado"); renderCurrent(); },
  restMinus: () => { if (rest && !rest.go) rest.end -= 15000; saveRest(); tick(); },
  restPlus: () => { if (rest) { rest.end = Math.max(rest.end, Date.now()) + 15000; rest.total = Math.max(rest.total, Math.ceil((rest.end - Date.now()) / 1000)); rest.go = false; } saveRest(); tick(); },
  restSkip: () => { rest = null; saveRest(); tick(); },
  sysTap: () => { if (active && !needGate()) setTab("treino"); },
  testSound: () => { ensureAudio(); const was = S.state.settings.sound; S.state.settings.sound = true; beep(); S.state.settings.sound = was; },
  sound: () => { S.state.settings.sound = !soundOn(); saveState(); ensureAudio(); tick(); },
  delSess: b => { if (sessArm !== b.dataset.id) { sessArm = b.dataset.id; b.textContent = "Toque de novo para apagar"; return; } removeSession(b.dataset.id); const ph = (PHOTOS || []).filter(p => p.sessionId === b.dataset.id); ph.forEach(p => delPhoto(p.id)); sessArm = ""; closeSheet(); toast("Treino apagado"); renderCurrent(); },
  quick: b => ask(b.dataset.q),
  qFree: () => quizFree(),
  menu: () => openMenu(),
  slLogout: () => { if (window.SL) window.SL.logout(); },
  galCmp: b => { galCmp = b.dataset.k; renderGaleria(); },
  openSess: b => openSess(b.dataset.id),
  measures: () => { mArm = ""; openMeasures(); },
  records: () => openRecords(),
  settings: () => openSettings(),
  setToggle: b => { const k = b.dataset.k; S.state.settings[k] = !S.state.settings[k]; saveState(); b.setAttribute("aria-pressed", String(S.state.settings[k])); if (k === "wake") { if (S.state.settings.wake) keepAwake(); else releaseAwake(); } },
  setUnit: b => { S.state.settings.unit = b.dataset.u; saveState(); openSettings(); renderCurrent(); },
  mMetric: b => { mMetric = b.dataset.k; openMeasures(); },
  mSave: () => {
    const rec = {id: uid(), date: ($("#mDate").value || new Date().toISOString().slice(0, 10)).slice(0, 10)};
    let any = false;
    MF.forEach(([k]) => { const v = num($("#m-" + k).value); rec[k] = v; if (v !== "") any = true; });
    if (!any) { const e = $("#mErr"); e.hidden = false; e.textContent = "Preencha pelo menos uma medida."; return; }
    S.state.measures.push(rec); if (S.state.measures.length > 400) S.state.measures.shift();
    saveState(); toast("Registro salvo"); openMeasures();
  },
  mDel: b => { if (mArm !== b.dataset.id) { mArm = b.dataset.id; b.textContent = "Confirmar"; return; } S.state.measures = S.state.measures.filter(m => m.id !== b.dataset.id); mArm = ""; saveState(); toast("Registro apagado"); openMeasures(); },
  phPick: () => { const f = $("#phFile"); if (f) f.click(); },
  phView: b => { const p = (PHOTOS || []).find(x => x.id === b.dataset.id); if (!p) return;
    openSheet("Foto de progresso", `<img src="${p.data}" alt="Foto de progresso de ${new Date(p.date).toLocaleDateString("pt-BR")}" style="width:100%;border-radius:18px"><p class="meta" style="text-align:center">${new Date(p.date).toLocaleDateString("pt-BR", {day: "2-digit", month: "long", year: "numeric"})}${p.workout ? ` · depois do ${esc(p.workout)}` : ""}</p>`,
      `<button class="b" data-a="sheetBack">Voltar</button><button class="b b-bad" data-a="phDel" data-id="${p.id}">Apagar foto</button>`); },
  phDel: b => { if (!b.dataset.arm) { b.dataset.arm = "1"; b.textContent = "Toque de novo"; return; } delPhoto(b.dataset.id); },
  addRoutine: () => openSheet("Adicionar ficha", `<div class="menu">
      <button class="mi" data-a="new"><span class="mi-ic">+</span><span><b>Montar do zero</b><small>Escolha os exercícios um a um na biblioteca.</small></span><span class="mi-go">›</span></button>
      ${sampleFn ? `<button class="mi ai" data-a="aiBuild"><span class="mi-ic">✦</span><span><b>Pedir para a IA</b><small>Descreva o treino e ela monta uma proposta.</small></span><span class="mi-go">›</span></button>` : ""}
      <button class="mi" data-a="import"><span class="mi-ic">↓</span><span><b>Importar do personal</b><small>Mande o PDF ou cole o texto da ficha. O app reconhece os exercícios.</small></span><span class="mi-go">›</span></button></div>`, ""),
  profile: () => openProfile(),
  streakHelp: () => openStreakHelp(),
  saveProfile: () => { const p = S.state.profile, n = ($("#pfName").value || "").trim(); if (n) p.name = n.slice(0, 40); p.notes = ($("#pfNotes").value || "").slice(0, 200); saveState(); closeSheet(); toast("Perfil salvo"); renderCurrent(); },
  resetAll: b => { if (!resetArm) { resetArm = true; b.textContent = "Toque de novo: apagar tudo"; return; } resetAll(); },
  more: b => { moreArm = false; openMore(b.dataset.id); },
  delR: b => { if (!moreArm) { moreArm = true; b.textContent = "Toque de novo para excluir"; return; } S.state.routines = S.state.routines.filter(r => r.id !== b.dataset.id); saveState(); closeSheet(); toast("Ficha excluída"); renderCurrent(); },
  gateQuiz: () => openQuiz(),
  gateOwn: () => { const p = S.state.profile; p.started = true; saveState(); renderCurrent();
    if (!S.state.routines.length) openSheet("Seu treino", `<p class="lede">Como você quer colocar seu treino?</p><div class="menu">
      <button class="mi" data-a="import"><span class="mi-ic">↓</span><span><b>Importar do personal</b><small>Mande o PDF ou cole o texto. O app separa as fichas e reconhece os exercícios.</small></span><span class="mi-go">›</span></button>
      <button class="mi" data-a="new"><span class="mi-ic">+</span><span><b>Montar do zero</b><small>Adicione os exercícios um a um.</small></span><span class="mi-go">›</span></button></div>`, ""); },
  gateBack: () => { gateStep = 0; renderGate(); },
  exec: b => openExec(b.dataset.n, b.dataset.g, b.dataset.back === "picker" ? "picker" : "close"),
  execEd: b => { const e = draft.exercises[+b.dataset.i]; if (e) openExec(e.name, e.group, "editor"); },
  mediaPick: () => { const f = $("#mediaFile"); if (f) f.click(); },
  mediaDel: () => deleteMedia()
};
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-a]");
  if (b && actions[b.dataset.a]) { if (b.tagName !== "SUMMARY") ev.preventDefault(); actions[b.dataset.a](b, ev); return; }
  if (ev.target.id === "sheet") actions.sheetBack();
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "gateForm") {
    ev.preventDefault();
    const n = ($("#gateName").value || "").trim();
    if (!n) { $("#gateName").focus(); return; }
    S.state.profile.name = n.slice(0, 40); saveState(); gateStep = 1; renderCurrent(); return;
  }
  if (ev.target.id !== "askForm") return;
  ev.preventDefault();
  const b = $("#askBtn"); if (b && b.dataset.stop) { if (aiAbort) aiAbort.abort(); return; }
  const t = $("#askIn"), v = t.value; t.value = ""; ask(v);
});
document.addEventListener("keydown", ev => {
  if (ev.target.id === "askIn" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("#askForm").requestSubmit(); }
  if (ev.key === "Escape" && !$("#sheet").hidden) actions.sheetBack();
});
let profT;
function onField(ev) {
  const t = ev.target, f = t.dataset && t.dataset.f; if (!f) return;
  const i = +t.dataset.i, k = +t.dataset.k;
  switch (f) {
    case "dname": draft.name = t.value; break;
    case "ename": draft.exercises[i].name = t.value; break;
    case "esets": draft.exercises[i].sets = t.value; break;
    case "ereps": draft.exercises[i].reps = t.value; break;
    case "eload": draft.exercises[i].load = t.value; break;
    case "erest": draft.exercises[i].rest = parseInt(t.value) || 60; break;
    case "enote": draft.exercises[i].note = t.value; break;
    case "pq": if (ev.type === "input") { pk.q = t.value; renderPickList(); } break;
    case "sload": active.ex[i].sets[k].load = t.value; saveActive(); break;
    case "sreps": active.ex[i].sets[k].reps = t.value; saveActive(); break;
    case "evo": if (ev.type === "change") { evoEx = t.value; $("#evoChart").innerHTML = evoChart(evoEx); } break;
    case "impText": if (imp) imp.text = t.value; break;
    case "impName": if (imp && imp.routines) imp.routines[+t.dataset.r].name = t.value.slice(0, 60); break;
    case "qnote": if (quiz) quiz.a.notes = t.value.slice(0, 200); break;
    case "setRest": if (ev.type === "change") { S.state.settings.rest = t.value; saveState(); } break;
    case "qbody": if (quiz) { quiz.a.body = quiz.a.body || {}; quiz.a.body[t.dataset.k] = t.value; } break;
    case "pnotes": S.state.profile.notes = t.value.slice(0, 300); clearTimeout(profT); profT = setTimeout(saveState, 600); break;
  }
}
document.addEventListener("input", onField);
document.addEventListener("change", onField);
document.addEventListener("change", ev => { if (ev.target.id === "phFile") { addPhoto(ev.target.files && ev.target.files[0]); ev.target.value = ""; } });
document.addEventListener("change", ev => { if (ev.target.id === "mediaFile") { uploadMedia(ev.target.files && ev.target.files[0]); ev.target.value = ""; } });
document.addEventListener("focusin", ev => { if (ev.target.matches(".srow input")) ev.target.select(); });

/* ============ início ============ */
renderSys();
if (S.state.profile.name) gateStep = 1;
if (active && !needGate()) setTab("treino"); else renderCurrent();
initCloud();
initCaps();
})();
